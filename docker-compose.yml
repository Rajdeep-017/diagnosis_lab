services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: labportal
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/labportal
      FRONTEND_ORIGIN: http://localhost:5173
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL:-staff@example.com}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-password123}
      DEMO_OPS_EMAIL: ${DEMO_OPS_EMAIL:-ops@example.com}
      DEMO_PATHOLOGIST_EMAIL: ${DEMO_PATHOLOGIST_EMAIL:-pathologist@example.com}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-deploy}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_DEMO_MODE: ${DEMO_MODE:-true}
      VITE_DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL:-staff@example.com}
      VITE_DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-password123}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  e2e-db:
    image: postgres:16
    profiles: ['e2e']
    environment:
      POSTGRES_DB: labportal_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-only-password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  e2e-backend:
    build:
      context: ./backend
    profiles: ['e2e']
    environment:
      DATABASE_URL: postgresql+psycopg://e2e:e2e-only-password@e2e-db:5432/labportal_e2e
      FRONTEND_ORIGIN: http://127.0.0.1:4174
      DEMO_MODE: 'true'
      DEMO_STAFF_EMAIL: staff@example.com
      DEMO_STAFF_PASSWORD: password123
      JWT_SECRET: integration-test-secret
      AUTH_COOKIE_SECURE: 'false'
      E2E_TEST_MODE: 'true'
      E2E_TEST_TOKEN: isocode-e2e-only-token
    ports:
      - '127.0.0.1:8001:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      e2e-db:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
